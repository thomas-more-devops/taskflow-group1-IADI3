<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic page settings -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Task Management App</title>

    <!-- External stylesheet and Google Fonts -->
    <link rel="stylesheet" href="styles/main.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">

        <!-- App header with the title and subtitle -->
        <header class="header">
            <div class="header-content">
                <h1 class="app-title">
                    <span class="icon">📋</span>
                    TaskFlow
                </h1>
                <p class="app-subtitle">Streamline your productivity</p>
            </div>
        </header>

        <!-- Main section containing task management and statistics -->
        <main class="main">

            <!-- Input field and button for adding new tasks -->
            <div class="task-input-section">
                <div class="input-container">
                    <input type="text" id="taskInput" placeholder="What needs to be done?" class="task-input">
                    <label class="sr-only" for="taskCategory">Task category</label>
                    <select id="taskCategory" class="category-select">
                        <option value="Work">Work</option>
                        <option value="Personal" selected>Personal</option>
                        <option value="Shopping">Shopping</option>
                        <option value="Health">Health</option>
                        <option value="Study">Study</option>
                    </select>
                    <button id="addTaskBtn" class="add-btn">
                        <span class="add-icon">+</span>
                        Add Task
                    </button>
                </div>
            </div>

            <!-- Displays the user's tasks and their current count -->
            <div class="tasks-section">
                <div class="tasks-header">
                    <h2>Your Tasks</h2>
                    <!-- Task count is updated by JavaScript -->
                    <span id="taskCount" class="task-count">0 tasks</span>
                </div>
                <div id="categoryFilters" class="category-filters" role="group" aria-label="Filter tasks by category">
                    <button class="category-filter active" type="button" data-category-filter="all" aria-pressed="true">All</button>
                    <button class="category-filter" type="button" data-category-filter="Work" aria-pressed="false">Work</button>
                    <button class="category-filter" type="button" data-category-filter="Personal" aria-pressed="false">Personal</button>
                    <button class="category-filter" type="button" data-category-filter="Shopping" aria-pressed="false">Shopping</button>
                    <button class="category-filter" type="button" data-category-filter="Health" aria-pressed="false">Health</button>
                    <button class="category-filter" type="button" data-category-filter="Study" aria-pressed="false">Study</button>
                </div>

                <!-- Tasks will be dynamically added here -->
                <div id="tasksList" class="tasks-list">
                    <!-- Tasks will be dynamically added here -->
                </div>

                <!-- Message displayed when the task list is empty -->
                <div id="emptyState" class="empty-state">
                    <div class="empty-icon">✨</div>
                    <h3 id="emptyStateTitle">No tasks yet</h3>
                    <p id="emptyStateMessage">Add your first task above to get started!</p>
                </div>
            </div>

            <!-- Statistics showing total, completed and pending tasks -->
            <div class="stats-section">
                <div class="stats-grid">
                    <div class="stat-card">
                        <span class="stat-number" id="totalTasks">0</span>
                        <span class="stat-label">Total Tasks</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="completedTasks">0</span>
                        <span class="stat-label">Completed</span>
                    </div>
                    <div class="stat-card">
                        <span class="stat-number" id="pendingTasks">0</span>
                        <span class="stat-label">Pending</span>
                    </div>
                    <div class="stat-card category-breakdown-card">
                        <span class="stat-label">Tasks by Category</span>
                        <div id="categoryStats" class="category-stat-list"></div>
                    </div>
                </div>
            </div>
        </main>

        <!-- Footer with copyright and technology information -->
        <footer class="footer">
            <p>&copy; 2024 TaskFlow. Built with HTML, CSS, and JavaScript.</p>
        </footer>
    </div>

    <!-- JavaScript file handling task management functionality -->
    <script src="scripts/app.js"></script>
</body>
</html>
